Configuration:
  Properties:
    Property:
      name: log-path
      value: "logs"

  Appenders:
    Console:
      name: Console_Appender
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "[%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n"

    File:
      name: File_Appender
      fileName: ${log-path}/logfile.log
      PatternLayout:
        pattern: "[%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n"

    Routing:
      name: "ROUTING"
      Routes:
        pattern: "[%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n"
 # <1>
        Route:
          File:
            name: "ROUTING-${sd:type}" # <2>
            fileName: "logs/${sd:type}.log" # <2>

  Loggers:
    Root:
      level: debug
      AppenderRef:
        ref: Console_Appender

    Logger:
      - name: org.myapps.youtubecommentranker.log.log4j2yaml
        level: debug
        AppenderRef:
          - ref: File_Appender
            level: debug
